<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 30px 16px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(180deg, #8ed4ee 0%, #c9ecf9 45%, #eaf8fd 100%);
  }

  h1 {
    color: #1f4e63;
    font-size: clamp(22px, 4vw, 34px);
    letter-spacing: 2px;
    text-shadow: 0 2px 0 rgba(255,255,255,.6);
  }
  .sub { color: #48788c; font-size: 14px; margin-top: -14px; }

  .stage {
    width: min(860px, 96vw);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(31, 78, 99, .28), 0 0 0 6px rgba(255,255,255,.55);
    line-height: 0;
  }
  .stage svg { width: 100%; height: auto; display: block; --t: 1.8s; }

  /* ===== 控制条 ===== */
  .controls {
    display: flex;
    align-items: center;
    gap: 18px;
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(6px);
    padding: 12px 22px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(31,78,99,.15);
  }
  button {
    border: none;
    cursor: pointer;
    width: 46px; height: 46px;
    border-radius: 50%;
    font-size: 18px;
    color: #fff;
    background: #d94f3d;
    box-shadow: 0 4px 10px rgba(217,79,61,.4);
    transition: transform .15s;
  }
  button:hover { transform: scale(1.08); }
  .speed-wrap { display: flex; align-items: center; gap: 10px; color: #1f4e63; font-size: 14px; }
  input[type=range] { width: 160px; accent-color: #d94f3d; cursor: pointer; }
  #speedVal { min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }

  /* 暂停状态 */
  body.paused .stage svg * { animation-play-state: paused !important; }

  footer { color: #6a93a5; font-size: 12px; }
</style>
</head>
<body>

<h1>🚲 鹈鹕骑自行车</h1>
<p class="sub">纯 SVG + CSS 动画 · 双腿按踏板逆运动学解算</p>

<div class="stage">
<!-- ===================== 动画主体 ===================== -->
<svg id="pelican" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="一只戴头盔的鹈鹕骑着红色自行车，在公路上前行">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fdcf2"/>
      <stop offset="1" stop-color="#eaf8fd"/>
    </linearGradient>
  </defs>

  <style>
    /* --t 为基准周期（曲柄一圈的时间），其余动画按比例缩放 */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinR { transform-box: view-box; transform-origin: 195px 380px; animation: spin calc(var(--t) * .5) linear infinite; }
    .spinF { transform-box: view-box; transform-origin: 565px 380px; animation: spin calc(var(--t) * .5) linear infinite; }

    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .bob { transform-box: view-box; animation: bob calc(var(--t) * .5) ease-in-out infinite; }

    @keyframes roadmove { to { stroke-dashoffset: -76; } }
    .roadline { animation: roadmove calc(var(--t) / 9) linear infinite; }

    @keyframes chainmove { to { stroke-dashoffset: -9; } }
    .chain { stroke-dasharray: 5 4; animation: chainmove calc(var(--t) / 12) linear infinite; }

    @keyframes drift { from { transform: translateX(880px); } to { transform: translateX(-260px); } }
    .cloud1 { transform-box: view-box; animation: drift calc(var(--t) * 25.5) linear infinite; animation-delay: -12s; }
    .cloud2 { transform-box: view-box; animation: drift calc(var(--t) * 19)   linear infinite; animation-delay: -25s; }
    .cloud3 { transform-box: view-box; animation: drift calc(var(--t) * 32)   linear infinite; animation-delay: -40s; }

    @keyframes bushmove { from { transform: translateX(880px); } to { transform: translateX(-200px); } }
    .bush1 { transform-box: view-box; animation: bushmove calc(var(--t) * 3.9) linear infinite; }
    .bush2 { transform-box: view-box; animation: bushmove calc(var(--t) * 5)   linear infinite; animation-delay: -4.5s; }

    /* 近侧腿关键帧：由踏板前/下/后/上四方位逆运动学解出 */
    @keyframes thighN { 0%{transform:rotate(23.1deg)} 25%{transform:rotate(62.9deg)} 50%{transform:rotate(50deg)} 75%{transform:rotate(6.9deg)} 100%{transform:rotate(23.1deg)} }
    @keyframes shinN  { 0%{transform:rotate(71.6deg)} 25%{transform:rotate(33.8deg)} 50%{transform:rotate(90deg)} 75%{transform:rotate(121.8deg)} 100%{transform:rotate(71.6deg)} }
    @keyframes footN  { 0%{transform:rotate(-94.7deg)} 25%{transform:rotate(-96.7deg)} 50%{transform:rotate(-140deg)} 75%{transform:rotate(-128.7deg)} 100%{transform:rotate(-94.7deg)} }
    /* 远侧腿：相位差 180° */
    @keyframes thighF { 0%{transform:rotate(230deg)} 25%{transform:rotate(186.9deg)} 50%{transform:rotate(203.1deg)} 75%{transform:rotate(242.9deg)} 100%{transform:rotate(230deg)} }
    @keyframes shinF  { 0%{transform:rotate(90deg)} 25%{transform:rotate(121.8deg)} 50%{transform:rotate(71.6deg)} 75%{transform:rotate(33.8deg)} 100%{transform:rotate(90deg)} }
    @keyframes footF  { 0%{transform:rotate(-320deg)} 25%{transform:rotate(-308.7deg)} 50%{transform:rotate(-274.7deg)} 75%{transform:rotate(-276.7deg)} 100%{transform:rotate(-320deg)} }

    .thighN { transform-box: view-box; transform-origin: 330px 250px; animation: thighN var(--t) linear infinite; }
    .shinN  { transform-box: view-box; transform-origin: 420px 250px; animation: shinN  var(--t) linear infinite; }
    .footN  { transform-box: view-box; transform-origin: 517px 250px; animation: footN  var(--t) linear infinite; }
    .thighF { transform-box: view-box; transform-origin: 330px 250px; animation: thighF var(--t) linear infinite; }
    .shinF  { transform-box: view-box; transform-origin: 420px 250px; animation: shinF  var(--t) linear infinite; }
    .footF  { transform-box: view-box; transform-origin: 517px 250px; animation: footF  var(--t) linear infinite; }

    @keyframes crankSpin { to { transform: rotate(360deg); } }
    @keyframes pedalHold { to { transform: rotate(-360deg); } }
    .crank      { transform-box: view-box; transform-origin: 360px 380px; animation: crankSpin  var(--t) linear infinite; }
    .crankFar   { transform-box: view-box; transform-origin: 360px 380px; animation: crankSpin  var(--t) linear infinite; }
    .pedalHoldN { transform-box: view-box; transform-origin: 405px 380px; animation: pedalHold var(--t) linear infinite; }
    .pedalHoldF { transform-box: view-box; transform-origin: 315px 380px; animation: pedalHold var(--t) linear infinite; }

    @keyframes sway { 0%,100% { transform: rotate(7deg); } 50% { transform: rotate(-7deg); } }
    .scarf { transform-box: view-box; transform-origin: 396px 168px; animation: sway calc(var(--t) * .4) ease-in-out infinite; }
    @keyframes pouch { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.05); } }
    .pouch { transform-box: view-box; transform-origin: 441px 134px; animation: pouch calc(var(--t) * .5) ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    .sun { transform-box: view-box; transform-origin: 700px 84px; animation: breathe calc(var(--t) * 2.2) ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      #pelican * { animation: none !important; }
    }
  </style>

  <!-- 背景 -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <g class="sun">
    <circle cx="700" cy="84" r="46" fill="#ffd76e" opacity=".35"/>
    <circle cx="700" cy="84" r="30" fill="#ffcf5c"/>
  </g>

  <!-- 云朵 -->
  <g class="cloud1" fill="#ffffff" opacity=".92">
    <ellipse cx="0" cy="96" rx="36" ry="16"/><ellipse cx="-26" cy="102" rx="22" ry="12"/><ellipse cx="28" cy="103" rx="25" ry="13"/>
  </g>
  <g class="cloud2" fill="#ffffff" opacity=".8">
    <ellipse cx="0" cy="160" rx="30" ry="13"/><ellipse cx="-22" cy="165" rx="18" ry="10"/><ellipse cx="24" cy="166" rx="20" ry="11"/>
  </g>
  <g class="cloud3" fill="#ffffff" opacity=".7">
    <ellipse cx="0" cy="52" rx="26" ry="11"/><ellipse cx="20" cy="57" rx="17" ry="9"/>
  </g>

  <!-- 远山与近丘 -->
  <path d="M0,432 Q150,336 320,414 Q470,352 620,416 Q720,384 800,420 L800,440 L0,440 Z" fill="#cbe6c3"/>
  <path d="M0,436 Q220,386 430,428 Q620,398 800,430 L800,444 L0,444 Z" fill="#b7dda6"/>

  <!-- 公路 -->
  <rect x="0" y="434" width="800" height="66" fill="#57616e"/>
  <rect x="0" y="434" width="800" height="6" fill="#6b7684"/>
  <line class="roadline" x1="0" y1="468" x2="800" y2="468" stroke="#f5d76e" stroke-width="6" stroke-dasharray="42 34"/>

  <!-- 路边灌木 -->
  <g class="bush1">
    <ellipse cx="0" cy="424" rx="26" ry="16" fill="#6a9c53"/>
    <ellipse cx="18" cy="428" rx="18" ry="12" fill="#7fb069"/>
  </g>
  <g class="bush2">
    <ellipse cx="0" cy="426" rx="20" ry="13" fill="#6a9c53"/>
    <ellipse cx="-14" cy="430" rx="14" ry="9" fill="#7fb069"/>
  </g>

  <!-- 骑行场景 -->
  <g class="bob">

    <!-- 远侧腿 -->
    <g class="thighF">
      <rect x="330" y="241.5" width="92" height="17" rx="8.5" fill="#ded9c8" stroke="#c4bfae" stroke-width="1.5"/>
      <g class="shinF">
        <rect x="420" y="243.5" width="97" height="13" rx="6.5" fill="#ded9c8" stroke="#c4bfae" stroke-width="1.5"/>
        <g class="footF">
          <path d="M515,244 L545,246 L543,254 L515,256 Z" fill="#c97b1e"/>
        </g>
      </g>
    </g>

    <!-- 后轮 -->
    <g class="spinR">
      <circle cx="195" cy="380" r="54" fill="none" stroke="#2f3640" stroke-width="11"/>
      <circle cx="195" cy="380" r="47" fill="none" stroke="#e8eaed" stroke-width="4"/>
      <g stroke="#c8cdd3" stroke-width="2">
        <line x1="148" y1="380" x2="242" y2="380"/>
        <line x1="148" y1="380" x2="242" y2="380" transform="rotate(30 195 380)"/>
        <line x1="148" y1="380" x2="242" y2="380" transform="rotate(60 195 380)"/>
        <line x1="148" y1="380" x2="242" y2="380" transform="rotate(90 195 380)"/>
        <line x1="148" y1="380" x2="242" y2="380" transform="rotate(120 195 380)"/>
        <line x1="148" y1="380" x2="242" y2="380" transform="rotate(150 195 380)"/>
      </g>
      <circle cx="195" cy="380" r="6" fill="#f0b429"/>
    </g>
    <!-- 前轮 -->
    <g class="spinF">
      <circle cx="565" cy="380" r="54" fill="none" stroke="#2f3640" stroke-width="11"/>
      <circle cx="565" cy="380" r="47" fill="none" stroke="#e8eaed" stroke-width="4"/>
      <g stroke="#c8cdd3" stroke-width="2">
        <line x1="518" y1="380" x2="612" y2="380"/>
        <line x1="518" y1="380" x2="612" y2="380" transform="rotate(30 565 380)"/>
        <line x1="518" y1="380" x2="612" y2="380" transform="rotate(60 565 380)"/>
        <line x1="518" y1="380" x2="612" y2="380" transform="rotate(90 565 380)"/>
        <line x1="518" y1="380" x2="612" y2="380" transform="rotate(120 565 380)"/>
        <line x1="518" y1="380" x2="612" y2="380" transform="rotate(150 565 380)"/>
      </g>
      <circle cx="565" cy="380" r="6" fill="#f0b429"/>
    </g>

    <!-- 飞轮与链条 -->
    <circle cx="195" cy="380" r="8" fill="#3a3f45"/>
    <line class="chain" x1="195" y1="372" x2="360" y2="363" stroke="#55606b" stroke-width="3.5"/>
    <line class="chain" x1="195" y1="388" x2="360" y2="397" stroke="#55606b" stroke-width="3.5"/>

    <!-- 远侧曲柄臂 + 远踏板 -->
    <g class="crankFar">
      <line x1="360" y1="380" x2="315" y2="380" stroke="#2b3036" stroke-width="7" stroke-linecap="round"/>
      <g class="pedalHoldF">
        <rect x="302" y="374" width="26" height="9" rx="3" fill="#14161a"/>
      </g>
    </g>

    <!-- 车架 -->
    <g stroke="#d94f3d" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M360,380 L338,262"/>
      <path d="M344,290 L518,278"/>
      <path d="M360,380 L520,272"/>
      <path d="M341,272 L195,380"/>
      <path d="M360,380 L195,380"/>
      <path d="M522,270 L565,380"/>
      <path d="M522,270 L510,236"/>
    </g>
    <!-- 车把 / 车铃 / 车座 / 牙盘 -->
    <path d="M510,236 C505,228 498,228 494,236" fill="none" stroke="#d94f3d" stroke-width="8" stroke-linecap="round"/>
    <line x1="496" y1="236" x2="486" y2="240" stroke="#33383e" stroke-width="11" stroke-linecap="round"/>
    <circle cx="505" cy="228" r="6" fill="#f0b429" stroke="#c98d1a" stroke-width="1.5"/>
    <path d="M316,258 Q338,246 362,256 Q338,265 316,258 Z" fill="#3a3f45"/>
    <circle cx="360" cy="380" r="17" fill="none" stroke="#3a3f45" stroke-width="5"/>
    <circle cx="360" cy="380" r="5" fill="#3a3f45"/>

    <!-- 鹈鹕 -->
    <path d="M270,190 L225,172 L240,192 L218,194 L242,206 L224,214 L268,214 Z" fill="#fbfaf4" stroke="#ddd8c8" stroke-width="1.5"/>
    <ellipse cx="322" cy="208" rx="62" ry="46" fill="#fbfaf4" stroke="#ddd8c8" stroke-width="2"/>
    <path d="M362,186 C398,182 392,152 416,132" fill="none" stroke="#fbfaf4" stroke-width="17" stroke-linecap="round"/>
    <g class="scarf">
      <path d="M396,166 C380,176 362,174 348,184 C362,180 380,184 394,176 Z" fill="#e74c3c"/>
      <path d="M396,168 C384,184 370,190 360,202 C372,192 386,190 398,178 Z" fill="#c0392b"/>
      <path d="M388,158 Q402,150 414,160 Q402,170 388,166 Z" fill="#e74c3c"/>
    </g>
    <circle cx="424" cy="124" r="21" fill="#fbfaf4" stroke="#ddd8c8" stroke-width="1.5"/>
    <path d="M401,122 A23,20 0 1 1 447,120 Z" fill="#f6c445"/>
    <path d="M410,104 L410,120 M424,101 L424,119 M438,105 L438,119" stroke="#e0a92e" stroke-width="2.5" fill="none"/>
    <line x1="399" y1="122" x2="449" y2="119" stroke="#e0a92e" stroke-width="3" stroke-linecap="round"/>
    <circle cx="432" cy="117" r="4.2" fill="#2d3436"/>
    <circle cx="433.5" cy="115.5" r="1.4" fill="#ffffff"/>
    <path class="pouch" d="M441,132 Q490,190 546,146 Q500,164 443,137 Z" fill="#ffb14d"/>
    <path d="M440,112 C480,114 525,126 548,140 L546,146 C520,140 478,132 440,130 Z" fill="#f6a623"/>
    <path d="M440,116 L544,141" stroke="#d98a12" stroke-width="1.2" fill="none"/>
    <path d="M348,182 C410,188 460,206 498,234 L494,242 C450,224 400,210 346,204 Z" fill="#efe9da" stroke="#d8d2bf" stroke-width="1.5"/>
    <path d="M368,196 C420,204 462,218 492,236 M388,202 C430,210 464,222 490,238" stroke="#d8d2bf" stroke-width="1.5" fill="none"/>

    <!-- 近侧曲柄臂 + 近踏板 -->
    <g class="crank">
      <line x1="360" y1="380" x2="405" y2="380" stroke="#3a3f45" stroke-width="7" stroke-linecap="round"/>
      <g class="pedalHoldN">
        <rect x="393" y="374" width="26" height="9" rx="3" fill="#22252a"/>
      </g>
    </g>

    <!-- 近侧腿 -->
    <g class="thighN">
      <rect x="330" y="241.5" width="92" height="17" rx="8.5" fill="#fbfaf4" stroke="#d8d4c4" stroke-width="1.5"/>
      <g class="shinN">
        <rect x="420" y="243.5" width="97" height="13" rx="6.5" fill="#fbfaf4" stroke="#d8d4c4" stroke-width="1.5"/>
        <g class="footN">
          <path d="M515,244 L545,246 L543,254 L515,256 Z" fill="#f0932b"/>
        </g>
      </g>
    </g>

  </g>
</svg>
</div>

<div class="controls">
  <button id="toggle" title="播放 / 暂停">⏸</button>
  <div class="speed-wrap">
    🐢 <input type="range" id="speed" min="0.6" max="3.5" step="0.1" value="1.8">
    🚀 <span id="speedVal">1.8s/圈</span>
  </div>
</div>

<footer>拖动滑块调整踩踏节奏 · 点按钮暂停观察动作细节</footer>

<script>
  const svg = document.getElementById('pelican');
  const speedVal = document.getElementById('speedVal');

  // 速度滑块 → 修改 CSS 变量 --t（曲柄一圈的基准周期）
  document.getElementById('speed').addEventListener('input', e => {
    svg.style.setProperty('--t', e.target.value + 's');
    speedVal.textContent = e.target.value + 's/圈';
  });

  // 播放 / 暂停
  const btn = document.getElementById('toggle');
  btn.addEventListener('click', () => {
    const paused = document.body.classList.toggle('paused');
    btn.textContent = paused ? '▶' : '⏸';
  });
</script>
</body>
</html>
